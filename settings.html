<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings • Travel</title>
  <link rel="stylesheet" href="goat.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <header>
    <div class="logo-div">
      <div class="logo">
        <p>Aris<span>.Dev</span></p>
      </div>
    </div>
    <ul>
      <li><a href="goat.html">Home</a></li>
      <li><a href="goat.html#destinations">Destination</a></li>
      <li><a href="goat.html#pricing">Pricing</a></li>
      <li><a href="goat.html#reviews">Reviews</a></li>
    </ul>
    <div class="btn-header">
      <button class="btn">
        <i class="fa-solid fa-user"></i>
        <span>Se connecter</span>
      </button>
    </div>
  </header>

  <section class="email-tipt">
    <h1 class="title">Paramètres</h1>
    <div class="together" style="align-items:flex-start; gap: 24px; flex-wrap:wrap;">
      <div class="input" style="padding:16px; max-width:520px; width:100%; display:flex; flex-direction:column; gap:12px;">
        <h3>Préférences</h3>
        <label style="display:flex; align-items:center; gap:10px;">
          <input id="pref-dark" type="checkbox" /> Activer le mode sombre
        </label>
      </div>
      <form id="pwd-form" class="input" style="padding:16px; max-width:520px; width:100%; display:flex; flex-direction:column; gap:10px;">
        <h3>Changer le mot de passe</h3>
        <input type="password" name="old" placeholder="Ancien mot de passe" required />
        <input type="password" name="neo" placeholder="Nouveau mot de passe (min 6)" required />
        <input type="password" name="neo2" placeholder="Confirmer le nouveau mot de passe" required />
        <button type="submit" class="btn"><i class="fa-solid fa-key"></i> Mettre à jour</button>
      </form>
      <div class="input" style="padding:16px; max-width:520px; width:100%; display:flex; flex-direction:column; gap:10px;">
        <h3>Compte</h3>
        <button id="btn-delete-account" class="btn" style="background:#c62828; color:#fff;"><i class="fa-solid fa-user-xmark"></i> Supprimer mon compte</button>
      </div>
    </div>
  </section>

  <footer>
    <div class="logo">
      <p>Aris<span>.Dev</span></p>
    </div>
    <p class="right-footer">All right are reserved <span>&copy; 2024</span></p>
  </footer>

  <script src="auth.js"></script>
  <script>
    (function(){
      const $ = (s,r=document)=>r.querySelector(s);
      const readUser = () => { try { return JSON.parse(localStorage.getItem('gt_user')||'null'); } catch { return null; } };
      const writeUser = (u) => localStorage.setItem('gt_user', JSON.stringify(u));

      document.addEventListener('DOMContentLoaded', () => {
        // Gate
        let u = readUser();
        if (!u) { location.href = 'login.html?redirect=settings.html'; return; }

        // Theme pref
        const prefDark = $('#pref-dark');
        const currentTheme = localStorage.getItem('gt_theme') || (document.body.classList.contains('dark') ? 'dark' : 'light');
        prefDark.checked = currentTheme === 'dark';
        const applyTheme = (t) => { document.body.classList.toggle('dark', t==='dark'); localStorage.setItem('gt_theme', t); };
        applyTheme(currentTheme);
        prefDark.addEventListener('change', () => applyTheme(prefDark.checked ? 'dark' : 'light'));

        // Password change
        const form = $('#pwd-form');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const old = form.old.value;
          const neo = form.neo.value;
          const neo2 = form.neo2.value;
          if (neo !== neo2) return alert('Les mots de passe ne correspondent pas.');
          if (!neo || neo.length < 6) return alert('Mot de passe trop court (min 6).');
          u = readUser();
          if (!u || u.password !== old) return alert('Ancien mot de passe incorrect.');
          u.password = neo; writeUser(u);
          alert('Mot de passe mis à jour.');
          form.reset();
        });

        // Delete account
        $('#btn-delete-account').addEventListener('click', () => {
          if (!confirm('Supprimer définitivement votre compte ?')) return;
          localStorage.removeItem('gt_user');
          alert('Compte supprimé');
          location.href = 'signup.html';
        });
      });
    })();
  </script>
</body>
</html>
